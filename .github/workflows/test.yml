name: build and test

on:
  push:
  pull_request:
    branches: [ main ]
    paths:
    - '**.cs'
    - '**.csproj'

# These are essential so program.cs won't throw on
# null config. These are for CI test purposes.
env:
  JWTKEY: "dummy-test-key-for-github-testing"
  JWTISSUER: "dummy"
  JWTAUDIENCE: "dummy"
  SUPABASE_CONNECTION_STRING: "dummy"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    
    - name: Restore
      run: dotnet restore Testings/Testings.csproj

    - name: Build
      run: dotnet build Testings/Testings.csproj --configuration Release --no-restore
    
    - name: Test
      run: dotnet test Testings/Testings.csproj --no-build --configuration Release --verbosity detailed